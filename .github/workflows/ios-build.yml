# Builds the Haven iPhone app and, if you tick the box, sends it to App Store Connect / TestFlight.
# By default the build runs on one of GitHub's Macs (EAS "local" build), so it doesn't use Expo's monthly
# cloud build limit. Pick "expo" under "Where to build" to use Expo's servers instead. It runs by itself when a merge to main changes the iPhone app
# (apps/mobile or packages/shared), and you can also run it from GitHub → Actions → "Build iOS app" →
# Run workflow.
#
# Needs the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# The app signs with the Apple team already saved in your Expo account. If Expo has never made
# signing files for the bundle ID com.seasidehaven.haven, also add these secrets once so EAS can make
# them without a password prompt (App Store Connect → Users and Access → Integrations → Keys):
#   ASC_API_KEY_P8 (the whole .p8 file), ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID
name: Build iOS app

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: production (App Store) or preview (install on your own devices)"
        type: choice
        options: [production, preview]
        default: production
      submit:
        description: "Send the finished build to App Store Connect (TestFlight)"
        type: boolean
        default: true
      where:
        description: "Where to build: github (GitHub's Mac, no Expo build limit) or expo (Expo's servers, uses the monthly limit)"
        type: choice
        options: [github, expo]
        default: github

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    # A Mac is needed to build an iPhone app here; Expo's servers only need a small Linux machine to start the build.
    runs-on: ${{ (inputs.where || 'github') == 'github' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      WHERE: ${{ inputs.where || 'github' }}
      # A merge to main has no inputs, so it builds for the App Store and sends to TestFlight.
      PROFILE: ${{ inputs.profile || 'production' }}
      SUBMIT: ${{ github.event_name == 'push' || inputs.submit }}
    steps:
      - name: Check the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret first (expo.dev → Account settings → Access tokens)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile --filter @haven/mobile...
      - name: Check the app is linked to its Expo project
        working-directory: apps/mobile
        run: |
          if ! node -e 'process.exit(require("./app.json").expo?.extra?.eas?.projectId ? 0 : 1)'; then
            echo "::error::apps/mobile/app.json has no extra.eas.projectId yet. Create the Haven project on expo.dev and add its ID."
            exit 1
          fi
      - name: App Store Connect key (optional)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -n "$ASC_API_KEY_P8" ]; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc.p8"
            echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
          fi
      - name: Pick the newest Xcode
        if: env.WHERE == 'github'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build on Expo's servers${{ (github.event_name == 'push' || (inputs.submit && inputs.profile == 'production')) && ' and submit' || '' }}
        if: env.WHERE == 'expo'
        working-directory: apps/mobile
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args="--platform ios --profile $PROFILE --non-interactive --no-wait"
          if [ "$SUBMIT" = "true" ] && [ "$PROFILE" = "production" ]; then args="$args --auto-submit"; fi
          eas build $args
          echo "The build is running on Expo. Watch it at https://expo.dev under the Haven project → Builds." >> "$GITHUB_STEP_SUMMARY"
      - name: Build on this Mac
        if: env.WHERE == 'github'
        working-directory: apps/mobile
        env:
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Signing files come from the Expo account (the same ones Expo's servers use).
        run: |
          eas build --platform ios --profile "$PROFILE" --non-interactive --local --output "$RUNNER_TEMP/Haven.ipa"
          echo "Built the app on GitHub's Mac." >> "$GITHUB_STEP_SUMMARY"
      - name: Send to TestFlight
        if: env.WHERE == 'github' && env.SUBMIT == 'true' && env.PROFILE == 'production'
        working-directory: apps/mobile
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          eas submit --platform ios --profile production --path "$RUNNER_TEMP/Haven.ipa" --non-interactive --wait
          echo "Sent to App Store Connect. It shows up in TestFlight once Apple finishes processing (usually 5 to 15 minutes)." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the app file
        if: env.WHERE == 'github' && always()
        uses: actions/upload-artifact@v4
        with:
          name: Haven-ios
          path: ${{ runner.temp }}/Haven.ipa
          if-no-files-found: ignore
          retention-days: 7
