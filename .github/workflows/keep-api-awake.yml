# Render's free plan puts the API to sleep after 15 minutes without visitors, which also pauses auction
# closing and live chat. This pings it so it stays up. Does nothing until HAVEN_API_URL is set.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.HAVEN_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 2 "${{ vars.HAVEN_API_URL }}/health"
